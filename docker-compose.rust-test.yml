# Phase 4 step 7 — side-by-side TEST stack for the Rust backend.
#
# Usage (from this directory):
#   docker compose -p ruststack \
#     -f docker-compose.yml -f docker-compose.rust-test.yml \
#     up -d db redis minio backend worker grafana
#
# Rebuild the Rust image after source/frontend changes (frontend base path MUST be /tlhub
# or the baked SPA requests assets at / and renders blank under the context path):
#   docker compose -p ruststack \
#     -f docker-compose.yml -f docker-compose.rust-test.yml \
#     build backend
#
# First run on a machine without ./secrets: it is a symlink to the canonical checkout's
# secrets dir; recreate with `ln -s ../manga-library/secrets secrets`.
#
# Design:
#   * Fresh app data by construction — db/minio/grafana mount ./data/* of THIS worktree,
#     which holds no state from the live stack. The live stack keeps its own volumes.
#   * Loopback-only direct ports, renumbered to avoid collisions with anything else on
#     the host (8084/55432/56379/19001/3002).
#   * TRAEFIK SERVING (2026-08-26): this is now THE stack users hit. Compose MERGES base
#     service maps, so the backend keeps its canonical traefik.* + watchtower labels and
#     revProxy-net membership from docker-compose.yml — with HOSTNAME set in .env the
#     proxy routes Host(${HOSTNAME})/tlhub straight here exactly like the Java stack did,
#     and grafana keeps /tlstats. Do NOT run the canonical Java stack at the same time:
#     both would register identical router rules and Traefik would load-balance across them.
#     Watchtower label is inert unless a label-enabled Watchtower runs on the host.
#   * The worker's MODEL caches (~GBs of YOLO/Paddle weights) are shared read-write
#     with the canonical checkout rather than re-downloaded; they are caches, not data.
#   * The compose-level backend healthcheck is replaced: it shells out to wget, which
#     the package-free Rust runtime does not carry — use the baked static probe instead.

services:
  db:
    container_name: manga-rust-db
    ports: !override
      - "127.0.0.1:55432:5432"

  redis:
    container_name: manga-rust-redis
    ports: !override
      - "127.0.0.1:56379:6379"

  minio:
    container_name: manga-rust-minio
    ports: !override
      - "127.0.0.1:19001:9001"

  backend:
    image: manga-tl-rust:test
    container_name: manga-rust-backend
    build:
      context: .
      dockerfile: backend-rust/Dockerfile
      args:
        # The SPA bakes asset URLs at build time; without this the UI is blank under /tlhub.
        - VITE_BASE_PATH=${CONTEXT_PATH:-/tlhub}
    ports: !override
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: [ "CMD", "/usr/local/bin/healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    container_name: manga-rust-grafana
    # Direct port renumbered vs the canonical stack's 3001; everything else
    # (provisioning, dashboards, secrets, traefik /tlstats labels, ./data/grafana)
    # is inherited unchanged — the datasource targets service name `db`, which
    # resolves to manga-rust-db inside this project's network.
    ports: !override
      - "127.0.0.1:3002:3000"

  worker:
    container_name: manga-rust-worker
    volumes:
      # Model caches only — shared with the canonical checkout to skip multi-GB
      # downloads; rendered_cache stays local to this worktree (fresh app data).
      - /home/sagnik/Projects/docker-composes/manga-library/data/worker/huggingface:/home/worker/.cache/huggingface
      - /home/sagnik/Projects/docker-composes/manga-library/data/worker/paddlex:/home/worker/.paddlex
