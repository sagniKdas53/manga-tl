services:
  db:
    image: postgres:15-alpine
    container_name: manga-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-manga_library}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    ports:
      # AUDIT-D5: bound to loopback rather than 0.0.0.0. Nothing in the stack reaches
      # Postgres this way — backend and worker both use the manga-net hostname `db`.
      # The mapping exists only for host-side tooling (psql, MCP clients, the
      # migrate_thumbnails.py script's DB_HOST/DB_PORT override), so it does not need
      # to be reachable from the LAN. Same treatment on redis and minio below.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    secrets:
      - db_password
    # AUDIT-L7: the json-file driver defaults to unbounded, and nothing in /etc/docker/daemon.json
    # overrode it. The worker alone wrote ~6 MB/hour, so a long-running stack grew a multi-hundred-MB
    # log per container in /var/lib/docker with nothing to reclaim it short of recreating the
    # container. Three 10 MB files keeps roughly the last few hours, which is the window `docker logs`
    # is actually used over here; anything older belongs in a query against Postgres, not a grep.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - manga-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-manga_library}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: manga-db-backup
    # NOTE: `restart: none` is not a valid Compose restart policy (the spec allows
    # no | always | on-failure | unless-stopped). Compose passes it through without
    # validating, so the service silently never started and backups stopped on
    # 2026-07-30 (commit 7e4a3c8) until the 2026-08-01 audit found it.
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-manga_library}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_ON_START=TRUE
    volumes:
      - ./data/backups:/backups
    secrets:
      - db_password
    depends_on:
      # The original "kept going unhealthy" symptom: with the plain list form this
      # started before Postgres accepted connections, so BACKUP_ON_START failed and
      # the image's healthcheck (curl localhost:$HEALTHCHECK_PORT) reported red.
      db:
        condition: service_healthy
    # AUDIT-L7: the json-file driver defaults to unbounded, and nothing in /etc/docker/daemon.json
    # overrode it. The worker alone wrote ~6 MB/hour, so a long-running stack grew a multi-hundred-MB
    # log per container in /var/lib/docker with nothing to reclaim it short of recreating the
    # container. Three 10 MB files keeps roughly the last few hours, which is the window `docker logs`
    # is actually used over here; anything older belongs in a query against Postgres, not a grep.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - manga-net
    # The image's built-in healthcheck probes every 5m with no start_period, so a
    # cold start spends 5 minutes in "starting" and one slow first dump flips it to
    # unhealthy. Give the first backup room before the probe counts.
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${HEALTHCHECK_PORT:-8080}/ || exit 1" ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m

  redis:
    image: valkey/valkey:8-alpine
    container_name: manga-valkey
    command: [ "valkey-server", "--appendonly", "yes" ]
    ports:
      # AUDIT-D5: loopback only. Valkey runs with no `requirepass`, so on 0.0.0.0 this
      # was an unauthenticated data store on the LAN — the sharpest edge of that entry.
      # Adding a password is a separate change: it has to land in the backend's
      # SPRING_DATA_REDIS_* config and the worker's REDIS_* config at the same time.
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    # AUDIT-L7: the json-file driver defaults to unbounded, and nothing in /etc/docker/daemon.json
    # overrode it. The worker alone wrote ~6 MB/hour, so a long-running stack grew a multi-hundred-MB
    # log per container in /var/lib/docker with nothing to reclaim it short of recreating the
    # container. Three 10 MB files keeps roughly the last few hours, which is the window `docker logs`
    # is actually used over here; anything older belongs in a query against Postgres, not a grep.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - manga-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: manga-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_password
    ports:
      # AUDIT-D5: loopback only. This is the console (9001), not the S3 API (9000) —
      # 9000 is not published at all and everything in the stack talks to it over
      # manga-net. The console is a browser UI with no in-network consumer, so it is
      # the one mapping here that cannot simply be dropped; loopback keeps it usable
      # from this host while taking it off the LAN.
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    secrets:
      - minio_password
    # AUDIT-L7: the json-file driver defaults to unbounded, and nothing in /etc/docker/daemon.json
    # overrode it. The worker alone wrote ~6 MB/hour, so a long-running stack grew a multi-hundred-MB
    # log per container in /var/lib/docker with nothing to reclaim it short of recreating the
    # container. Three 10 MB files keeps roughly the last few hours, which is the window `docker logs`
    # is actually used over here; anything older belongs in a query against Postgres, not a grep.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - manga-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/sagnikdas53/manga-tl:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - VITE_BASE_PATH=${CONTEXT_PATH:-/tlhub}
    container_name: manga-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-manga_library}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD_FILE=/run/secrets/db_password
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      # AUDIT-D4: the two services want incompatible forms of this value, so they get
      # separate .env knobs. The Java SDK's MinioClient.endpoint() treats a bare host
      # as HTTPS, so this one must carry the scheme. See MINIO_ENDPOINT_HOST on the
      # worker. Both used to read ${MINIO_ENDPOINT} and only agreed because .env sets
      # nothing — setting it would have broken whichever service it did not suit.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT_URL:-http://minio:9000}
      - MINIO_EXTERNAL_URL=${MINIO_EXTERNAL_URL:-}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - CONTEXT_PATH=${CONTEXT_PATH:-/tlhub}
      - INTERNAL_API_TOKEN_FILE=/run/secrets/internal_api_token
      - WORKER_URLS=${WORKER_URLS:-http://worker:8000}
      - WORKER_POLL_MS=${WORKER_POLL_MS:-2000}
      - WORKER_API_SECRET_FILE=/run/secrets/worker_api_secret
      - USE_REMOTE_ML=${USE_REMOTE_ML:-false}
      - REMOTE_ML_URL=${REMOTE_ML_URL:-http://worker:8000}
      # AUDIT-D5: the shipped default was DEBUG. application.yml already defaults both
      # `root` and `com.manga.library` to INFO, so compose was the only thing forcing
      # DEBUG on a deployment with no .env.
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OCR_MODEL_PROVIDER=${OCR_MODEL_PROVIDER:-openrouter}
      - OCR_VLM_MODEL=${OCR_VLM_MODEL:-}
      - OCR_VLM_MODEL_LIST=${OCR_VLM_MODEL_LIST:-}
      - TL_MODEL_PROVIDER=${TL_MODEL_PROVIDER:-openrouter}
      - TL_LLM_MODEL=${TL_LLM_MODEL:-}
      - TL_LLM_MODEL_LIST=${TL_LLM_MODEL_LIST:-}
      - QA_MODEL_PROVIDER=${QA_MODEL_PROVIDER:-openrouter}
      - QA_LLM_MODEL=${QA_LLM_MODEL:-}
      - QA_VLM_MODEL=${QA_VLM_MODEL:-}
      - QA_LLM_MODEL_LIST=${QA_LLM_MODEL_LIST:-}
      - QA_VLM_MODEL_LIST=${QA_VLM_MODEL_LIST:-}
    depends_on:
      # AUDIT-D3: the plain-list form only waits for the container to be created, so
      # the healthchecks defined on db, redis and minio were ignored on startup and
      # the backend raced its own dependencies. Same class of bug that took db-backup
      # down for three days.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    secrets:
      - db_password
      - minio_password
      - jwt_secret
      - internal_api_token
      - worker_api_secret
    # AUDIT-L7: the json-file driver defaults to unbounded, and nothing in /etc/docker/daemon.json
    # overrode it. The worker alone wrote ~6 MB/hour, so a long-running stack grew a multi-hundred-MB
    # log per container in /var/lib/docker with nothing to reclaim it short of recreating the
    # container. Three 10 MB files keeps roughly the last few hours, which is the window `docker logs`
    # is actually used over here; anything older belongs in a query against Postgres, not a grep.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - manga-net
      - revProxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=revProxy-net"
      - "traefik.http.routers.manga-backend.entrypoints=web,websecure"
      - "traefik.http.routers.manga-backend.rule=Host(`${HOSTNAME}`) && PathPrefix(`${CONTEXT_PATH:-/tlhub}`)"
      - "traefik.http.services.manga-backend.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.http-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.http-to-https.redirectscheme.permanent=true"
      - "traefik.http.routers.manga-backend.middlewares=http-to-https@docker"
      - "traefik.http.routers.manga-backend.tls=true"
      - "traefik.http.routers.manga-backend.tls.certresolver=tailsolver"
      - "traefik.http.routers.manga-backend.tls.domains[0].main=${HOSTNAME}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080$${CONTEXT_PATH:-/tlhub}/actuator/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: ghcr.io/sagnikdas53/manga-tl-worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: manga-worker
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # AUDIT-D4: bare host:port, no scheme — the Python SDK rejects a URL here and
      # takes TLS from its own secure= flag. See MINIO_ENDPOINT_URL on the backend.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT_HOST:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_password
      - BACKEND_CALLBACK_URL=${BACKEND_CALLBACK_URL:-http://backend:8080}${CONTEXT_PATH:-/tlhub}/api/internal/jobs/callback
      - INTERNAL_API_TOKEN_FILE=/run/secrets/internal_api_token
      # Fragment grouping. The default was 1.0 here against a code default of 0.50, so the
      # deployment ran at double the tested value; both are now 0.35, measured over 40 corpus
      # pages (docs/region_waist_probe_2026-08-09.md). Leave the waist gate on unless a page's
      # balloon masks are known bad — it is what stops two touching balloons becoming one region.
      - OCR_MERGE_THRESHOLD=${OCR_MERGE_THRESHOLD:-0.35}
      - OCR_WAIST_GATE=${OCR_WAIST_GATE:-1.0}
      - OCR_ORIENTATION=${OCR_ORIENTATION:-vote}
      # API Keys are loaded via DOCKER_SECRETS_JSON
      - DOCKER_SECRETS_JSON=/run/secrets/api_keys
      - PROVIDERS_CONFIG=/app/config/providers.json
      - OCR_MODEL_PROVIDER=${OCR_MODEL_PROVIDER:-openrouter}
      - OCR_VLM_MODEL=${OCR_VLM_MODEL:-}
      - OCR_VLM_MODEL_LIST=${OCR_VLM_MODEL_LIST:-}
      - TL_MODEL_PROVIDER=${TL_MODEL_PROVIDER:-openrouter}
      - TL_LLM_MODEL=${TL_LLM_MODEL:-}
      - TL_LLM_MODEL_LIST=${TL_LLM_MODEL_LIST:-}
      - QA_MODEL_PROVIDER=${QA_MODEL_PROVIDER:-openrouter}
      - QA_LLM_MODEL=${QA_LLM_MODEL:-}
      - QA_VLM_MODEL=${QA_VLM_MODEL:-}
      - QA_LLM_MODEL_LIST=${QA_LLM_MODEL_LIST:-}
      - QA_VLM_MODEL_LIST=${QA_VLM_MODEL_LIST:-}
      # AUDIT-W2: unset, i.e. unlimited. Every provider in config/providers.json carries its own
      # `rateLimits`; this is only the fallback for one that does not, and it used to default to
      # 10 RPM, so such a provider silently inherited one call every 6 seconds.
      - RATE_LIMIT=${RATE_LIMIT:-}
      - DISABLE_LOCAL_OCR=${DISABLE_LOCAL_OCR:-false}
      - DISABLE_DEEPL_TRANSLATE=${DISABLE_DEEPL_TRANSLATE:-false}
      - DISABLE_GOOGLE_TRANSLATE=${DISABLE_GOOGLE_TRANSLATE:-false}
      # These are the local fallbacks if cloud is not available and these are configured then use these
      # LOCAL_LLM_ENDPOINT and OLLAMA_REMOTE_URL do the same thing so just keep LOCAL_LLM_ENDPOINT
      - DISABLE_LOCAL_LLM=${DISABLE_LOCAL_LLM:-false}
      - LOCAL_LLM_PROVIDER=${LOCAL_LLM_PROVIDER:-ollama}
      - LOCAL_LLM_ENDPOINT=${LOCAL_LLM_ENDPOINT:-http://ollama:11434/v1/chat/completions}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-gemma4:e4b}
      - LOCAL_VLM_MODEL=${LOCAL_VLM_MODEL:-qwen2.5-vl-3b-instruct}
      - QA_MODE=${QA_MODE:-auto}
      - RENDER_CACHE_DIR=/app/rendered_cache
      # Finally the remote workers, to distribute load to shouldn't this be added to the back-end
      # See .env.example: raised from 2 on 2026-08-02 per AUDIT-W10, together with a light-slot
      # default of CONCURRENT_JOBS - MAX_HEAVY_SLOTS = 4.
      - CONCURRENT_JOBS=${CONCURRENT_JOBS:-5}
      - MAX_HEAVY_SLOTS=${MAX_HEAVY_SLOTS:-}
      - MAX_LIGHT_SLOTS=${MAX_LIGHT_SLOTS:-}
      - REUSE_IDLE_SLOTS=${REUSE_IDLE_SLOTS:-true}
      - WORKER_API_SECRET_FILE=/run/secrets/worker_api_secret
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      # Comment these out if you want to seed the models or re-download them
      # - HF_HUB_OFFLINE=1
      # - PADDLEX_OFFLINE_MODE=1
      # - PADDLE_DISABLE_TELEMETRY=1
      # Log Level
      # AUDIT-D5: shipped default was DEBUG here too; config.py already falls back to
      # INFO. Note this reads LOG_LEVEL_WORKER, not LOG_LEVEL — .env and .env.example
      # both set it to DEBUG deliberately, and that is left alone. Only the default
      # for a deployment carrying no .env changes.
      - LOG_LEVEL=${LOG_LEVEL_WORKER:-INFO}
      # Compose reads .env only for ${...} interpolation inside this file; nothing here
      # forwards it to the container on its own. Without this line the knob documented in
      # .env.example is inert and config.py always falls back to its own 2000.
      - LOG_PAYLOAD_MAX_CHARS=${LOG_PAYLOAD_MAX_CHARS:-2000}
      - PADDLEOCR_DET_MODEL=${PADDLEOCR_DET_MODEL:-PP-OCRv6_medium_det}
      - PADDLEOCR_REC_MODEL=${PADDLEOCR_REC_MODEL:-PP-OCRv6_medium_rec}
      - PADDLEOCR_DEVICE=${PADDLEOCR_DEVICE:-cpu}
      # Must stay in step with the CPU quota under `deploy` below. Neither Paddle
      # nor OpenMP can see a cgroup quota: they size their thread pools from the
      # host's core count and would start 4 threads that then contend for 2 cores'
      # worth of runtime. The context switching costs more than the cap saves, so
      # the limit and the thread count have to be raised or lowered together.
      - OMP_NUM_THREADS=${WORKER_THREADS:-2}
      - MKL_NUM_THREADS=${WORKER_THREADS:-2}
      - OPENBLAS_NUM_THREADS=${WORKER_THREADS:-2}
    depends_on:
      # AUDIT-D3, as above. backend carries start_period: 40s, so a cold start holds
      # the worker back until the backend can actually accept its callbacks — which
      # is the point: the worker's first act is to register against it.
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    secrets:
      - minio_password
      - internal_api_token
      - worker_api_secret
      - api_keys
    volumes:
      - ./config/providers.json:/app/config/providers.json:ro
      # AUDIT-D2: the worker runs as UID 10001, so its caches live in that user's home
      # rather than /root. The host directories are chowned to 10001 to match.
      - ./data/worker/huggingface:/home/worker/.cache/huggingface
      - ./data/worker/paddlex:/home/worker/.paddlex
      - ./data/worker/rendered_cache:/app/rendered_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # AUDIT-L7: the json-file driver defaults to unbounded, and nothing in /etc/docker/daemon.json
    # overrode it. The worker alone wrote ~6 MB/hour, so a long-running stack grew a multi-hundred-MB
    # log per container in /var/lib/docker with nothing to reclaim it short of recreating the
    # container. Three 10 MB files keeps roughly the last few hours, which is the window `docker logs`
    # is actually used over here; anything older belongs in a query against Postgres, not a grep.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - manga-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Measured on the 2026-08-01 runs: the worker is the sustained CPU consumer
    # (mean 76-93%, peak 216%, above 150% in 22 of 54 samples) while db and redis
    # sit near 2%. With every container together peaking at 279% of a 4-core box,
    # the browser was left competing for scraps, and two thirds of the Queue
    # Manager jank measured as main-thread time where no work happened at all.
    # Capping the worker at 2 CPUs leaves 2 cores for the UI and everything else.
    #
    # Compose honours these without Swarm from V2 onward (this is V5); the old
    # advice that `deploy` only applies to `docker stack deploy` is out of date.
    #
    # The memory cap is a blast radius, not a target: observed peak was 2.1 GiB,
    # so 4g is roughly 2x headroom. Exceeding it kills the container rather than
    # the host, which on this box also means killing the desktop session.
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2.0}"
          memory: ${WORKER_MEMORY:-4g}
        reservations:
          cpus: "0.5"
          memory: 512m

  # The dashboard half of the 2026-08-15 logging audit.
  #
  # Reads Postgres directly and nothing else — no Prometheus, no Loki, no exporters. Every number
  # worth charting here is a pipeline fact the backend already writes as it goes: `jobs` carries
  # per-stage timings and failures, `job_costs` carries per-model tokens and spend. A metrics
  # pipeline would mean emitting those same events a second time and keeping two definitions in
  # step; a log pipeline would mean shipping and re-parsing lines to recover what is already a
  # column. Live tailing stays with Dozzle in monitor-stack, which is what it is good at.
  #
  # Not published on the LAN and not behind Traefik: it is reachable on 127.0.0.1:3001 from this
  # host only, matching the treatment db/redis/minio get above (AUDIT-D5). Give it a router label
  # and a real password if it ever needs to be reachable from elsewhere.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: manga-grafana
    # The image runs as UID 472, and ./data/grafana is a bind mount owned by the host user, so the
    # container cannot create its own plugins/ and png/ directories under it — it crash-loops on
    # "GF_PATHS_DATA is not writable". Same shape as AUDIT-D2 on the worker's cache mounts, solved
    # the other way round: the worker's host directories are chowned to its UID, while here the
    # container is told to be the host user. That avoids a root-owned directory inside the repo,
    # and Grafana keeps no state that needs a dedicated owner.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      # Provisioning reads ${POSTGRES_DB}/${GRAFANA_DB_PASSWORD} out of the datasource YAML.
      - POSTGRES_DB=${POSTGRES_DB:-manga_library}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # Nothing here is worth phoning home about, and the instance has no outbound need.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Panels run operator SQL against a live database; the datasource user is SELECT-only
      # (database/grafana_readonly.sql), and anonymous access would hand that query surface to
      # anyone who reaches the port.
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
      - grafana_db_password
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - manga-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  manga-net:
    driver: bridge
  revProxy-net:
    external: true

secrets:
  db_password:
    file: ./secrets/db_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  internal_api_token:
    file: ./secrets/internal_api_token.txt
  worker_api_secret:
    file: ./secrets/worker_api_secret.txt
  api_keys:
    file: ./secrets/api_keys.json
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  grafana_db_password:
    file: ./secrets/grafana_db_password.txt
