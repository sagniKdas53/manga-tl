name: CI - Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/vite.config.*"
      - "frontend/Dockerfile"
      - ".github/workflows/ci-npm.yml"
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/vite.config.*"
      - "frontend/Dockerfile"
      - ".github/workflows/ci-npm.yml"

permissions:
  contents: read

jobs:
  build:
    name: Install, lint, and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `vite build` strips types without checking them, so for the life of this project the
      # frontend was never typechecked at all: AUDIT-R5 reached main as two hard type errors with
      # every check green. This runs before the tests so a type error reports as a type error
      # rather than as a confusing runtime failure.
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
