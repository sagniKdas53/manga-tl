name: CI - Layout

# Text layout must not change unnoticed. With no page images, no page text and no model calls, so it
# runs on a public repo:
#   - the layout check: the renderer's own layout code, in the renderer's own image, on stored boxes
#     and outlines with stand-in text;
#   - the quality tools' own tests.
# Grouping has its own check in the worker's tests (tests/test_grouping_golden.py).
# Until 2026-11-10 a "ledger rule" also failed a layout PR that added no row to the layout ledger.
# The owner dropped it: it checked that a row existed, not what it said.
# See docs/quality-runs/layout-regression/README.md.
on:
  pull_request:
    paths:
      - "packages/page-scene/**"
      - "services/page-renderer/**"
      - "scripts/quality/**"
      - ".github/workflows/ci-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-tools:
    name: Quality tools' tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test the tools
        run: |
          python3 -m unittest scripts/quality/test_compare_layout.py
          python3 -m unittest scripts/quality/test_predict_collisions.py

  layout-check:
    name: Text layout is unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the renderer image
        run: docker build -f services/page-renderer/Dockerfile -t layout-renderer .
      - name: Fit the stored boxes
        run: >-
          docker run --rm --network none -e HOME=/tmp -v "$PWD":/repo:ro -w /repo --entrypoint node layout-renderer
          scripts/quality/layout_ci.cjs --fixture scripts/quality/fixtures/layout-fixture.json
