name: Refresh provider models

on:
  schedule:
    - cron: "30 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-provider-models
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh OpenRouter and NVIDIA catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test refresh policy
        run: python -m unittest discover -s scripts -p 'test_refresh_provider_models.py'

      - name: Refresh providers.json
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/refresh_provider_models.py --apply

      - name: Commit catalog changes
        run: |
          if [ -z "$(git status --porcelain -- config/providers.json)" ]; then
            echo "No provider catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/providers.json
          git commit -m "Refresh provider model catalog"
          git push
