spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  data:
    redis:
      database: 1
minio:
  endpoint: http://127.0.0.1:1
  # Same reason as application-test.yml: MinioConfig has no annotation default and the
  # application.yml fallback is gone (AUDIT-S1). Both test profiles need their own values.
  accessKey: integration-profile-minio-access-key
  secretKey: integration-profile-minio-secret-key
worker:
  health-url: http://127.0.0.1:1/health
  urls: http://127.0.0.1:1

# See application-test.yml — the "integration" profile is likewise a development profile.
jwt:
  secret: integration-profile-jwt-secret-not-used-outside-tests-000000

internal:
  api-token: integration-profile-internal-token
