# Developer-convenience profile. Activate with SPRING_PROFILES_ACTIVE=local.
#
# This file exists so that application.yml can ship with *no* secret fallbacks at all
# (AUDIT-S1). The values below are deliberately marked as development-only: they are
# recognised by SecretsStartupValidator, which refuses to start if it sees them while
# no development profile is active. Never activate this profile in production.
jwt:
  secret: dev-only-insecure-jwt-secret-do-not-use-in-production-0000000000

internal:
  api-token: dev-only-insecure-internal-token-do-not-use-in-production

spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

minio:
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
