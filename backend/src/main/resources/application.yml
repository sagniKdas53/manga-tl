spring:
  application:
    name: manga-library-backend
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/manga_library}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          halt_on_error: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  web:
    resources:
      static-locations: classpath:/static/,file:../frontend/dist/,file:frontend/dist/
  jackson:
    serialization:
      fail-on-empty-beans: false

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  externalUrl: ${MINIO_EXTERNAL_URL:}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: manga-library

# No fallbacks here on purpose (AUDIT-S1/S2). An unset secret must fail startup via
# SecretsStartupValidator, not silently boot on a shared default. Dev values live in
# application-local.yml, which production never activates.
jwt:
  secret: ${JWT_SECRET:}
  expirationMs: 86400000 # 24 hours

internal:
  api-token: ${INTERNAL_API_TOKEN:}

worker:
  health-url: ${WORKER_HEALTH_URL:http://localhost:8000/health}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  servlet:
    context-path: ${CONTEXT_PATH:/tlhub}
  tomcat:
    accesslog:
      enabled: true
      # %U (path only), not %r (full request line) — %r includes the query string, which is how
      # SSE session tokens ended up in the access log in plaintext (AUDIT-S4).
      pattern: '%h %l %u %t "%m %U %H" %s %b %Dms'

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.manga.library: ${LOG_LEVEL:INFO}
