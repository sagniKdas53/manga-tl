spring:
  application:
    name: manga-library-backend
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/manga_library}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # AUDIT-B5: was `update`, which silently ALTERs the live schema and never records what it
      # did -- that is how images.reader_storage_path ended up live but absent from
      # database/init.sql. Schema changes are made by hand now: edit the entity, manually apply
      # the matching DDL to the live database, and update database/init.sql to match (guarded by
      # InitScriptReconciliationTest). `validate` makes forgetting any of those a boot-time
      # failure instead of a silent, unrecorded ALTER TABLE.
      ddl-auto: validate
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          halt_on_error: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    web:
      pageable:
        # AUDIT-B11: without this, all three paginated endpoints inherit Spring's default
        # ceiling of 2000. `@PageableDefault(size = ...)` on listSeries/listChapters/listPages
        # sets the *default* only -- `?size=2000` overrides it -- so the unbounded list
        # response AUDIT-F8 existed to remove was still one query parameter away. 100 is
        # generous against the intended batch sizes of 10/15/25 and no caller asks for more.
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  web:
    resources:
      static-locations: classpath:/static/,file:../frontend/dist/,file:frontend/dist/
  jackson:
    serialization:
      fail-on-empty-beans: false
  task:
    scheduling:
      pool:
        # AUDIT-B1: five @Scheduled tasks share this pool, and WorkerDispatcherService.dispatchJobs
        # blocks up to 30s per worker on a 2s cadence. At Spring's default of 1 an unresponsive
        # worker stalls stale-job recovery, debounced renders and export cleanup behind it.
        size: ${SCHEDULING_POOL_SIZE:4}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  externalUrl: ${MINIO_EXTERNAL_URL:}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  bucketName: manga-library

# No credential in this file carries a fallback, on purpose (AUDIT-S1/S2). An unset secret must fail
# startup via SecretsStartupValidator, not silently boot on a shared default. Dev values live in
# application-local.yml, which production never activates.
#
# This covers the datasource password and the MinIO keys above as well as the two below. The S1 fix
# originally de-defaulted only `jwt.secret` and `internal.api-token` — the two the finding named by
# variable — while copying `postgres`/`minioadmin` into application-local.yml without deleting the
# originals, so this file kept a second source of truth for them until 2026-08-06.
jwt:
  secret: ${JWT_SECRET:}
  expirationMs: 86400000 # 24 hours

internal:
  api-token: ${INTERNAL_API_TOKEN:}

worker:
  health-url: ${WORKER_HEALTH_URL:http://localhost:8000/health}

management:
  endpoints:
    web:
      exposure:
        # `loggers` is the point of this list. The complaint it answers: backend logs were too
        # verbose to run at DEBUG, so they ran at INFO and the detail was unavailable exactly when
        # something needed diagnosing. With this endpoint the level is per-logger and live —
        #
        #   JWT=$(curl -s localhost:8080/tlhub/api/auth/login -H 'Content-Type: application/json' \
        #          -d '{"email":"<admin-email>","password":"<pw>"}' | jq -r .token)
        #   curl -X POST localhost:8080/tlhub/actuator/loggers/com.manga.library.service.JobCoordinatorService \
        #        -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
        #        -d '{"configuredLevel":"DEBUG"}'
        #
        # The Bearer token is required because SecurityConfig guards /actuator/** with hasRole("ADMIN")
        # and this deployment enables no Basic auth — JwtAuthFilter reads Bearer only.
        #
        # — and `{"configuredLevel":null}` puts it back. No restart, no rebuild, and the other 20
        # loggers stay quiet. That is what makes the DEBUG demotions in InternalJobController and
        # JobCoordinatorService safe: the detail is not gone, it is off by default.
        #
        # ADMIN-only via SecurityConfig; /actuator/health stays public for the container healthcheck.
        include: health,loggers,metrics,env
  endpoint:
    health:
      show-details: when-authorized

server:
  servlet:
    context-path: ${CONTEXT_PATH:/tlhub}
  # AUDIT-F5 asked for precompressed .gz/.br from a Vite plugin, copying yt-diff. That does not
  # work here: this app serves its own frontend from classpath:/static, Spring will not serve a
  # precompressed sibling without an EncodedResourceResolver, and the Traefik router in front
  # carries no compress middleware. Emitted .br files would simply never be read, and the 380 kB
  # MUI chunk would keep going out uncompressed. Compressing where the bytes are actually served
  # is the fix; it covers the API's JSON responses too.
  compression:
    enabled: true
    # Enumerated, not defaulted, so text/event-stream stays off the list: compressing the SSE
    # stream would buffer events behind the encoder and defeat the whole push channel.
    mime-types: text/html,text/css,text/plain,application/javascript,application/json,image/svg+xml
    # Below about a packet's worth, compression costs more than it saves.
    min-response-size: 1024
  tomcat:
    accesslog:
      enabled: true
      # %U (path only), not %r (full request line) — %r includes the query string, which is how
      # SSE session tokens ended up in the access log in plaintext (AUDIT-S4).
      #
      # AUDIT-L1: this was enabled and carefully patterned, and nobody had ever read a line of it.
      # With no `directory` set, Tomcat resolves the default `logs` relative to its temp dir, so the
      # output went to /tmp/tomcat.8080.<random>/logs/access_log.<date>.log *inside the container* —
      # absent from `docker logs`, absent from Dozzle, and destroyed on every recreate. Verified
      # empty: `docker logs manga-backend | grep -c '"GET '` returned 0 while the file held the
      # requests. The directory/prefix/suffix trio below is Tomcat's documented way to say stdout,
      # which is the only destination the container stack actually collects.
      directory: /dev
      prefix: stdout
      suffix: ''
      # Tomcat appends a date to the filename unless the pattern is empty; with a rotating name it
      # would write /dev/stdout.2026-08-15 as a regular file instead of the stream.
      file-date-format: ''
      # Without this the valve batches writes, so request lines arrive in the container log out of
      # order relative to the application's own lines and lag behind a live tail.
      buffered: false
      # The healthcheck hits /actuator/health every 30s and the worker polls /health; at one line
      # per probe that is most of the access log on an idle stack, saying nothing.
      condition-unless: skipAccessLog
      # The trailing unit is `us`, not `ms`. Tomcat 10.1 redefined %D from milliseconds to
      # microseconds, and this pattern kept the old suffix — so every duration it wrote was
      # mislabelled by 1000x. It went unnoticed because the log was landing in a container temp
      # directory nobody read (see the AUDIT-L1 note above); the first request logged to stdout
      # after that fix read "9974ms" for a 403 that curl timed at 9.8ms.
      #
      # %D is kept rather than switched to %F: %F measures time-to-commit, which for the SSE stream
      # is the start of the response and not its duration. Note %D is unreliable on async requests
      # regardless — an SSE line was observed carrying 2841852471.
      pattern: '%h %l %u %t "%m %U %H" %s %b %Dus'

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.manga.library: ${LOG_LEVEL:INFO}
